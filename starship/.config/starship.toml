# ==============================================================================
# Starship Prompt Configuration (Nordic Powerline Style)
# Rice: petrolal-kde-rice
# ==============================================================================

format = """
[ ](#4c566a)\
$os\
[](bg:#2e3440 fg:#4c566a)\
[ ](bg:#2e3440 fg:#4c566a)\
$username\
[](bg:#4c566a fg:#2e3440)\
$directory\
[](bg:#3b4252 fg:#4c566a)\
$git_branch\
$git_status\
[](fg:#3b4252 bg:#2e3440)\
[](fg:#2e3440 bg:#4c566a)\
$cmd_duration\
[](fg:#4c566a bg:#434c5e)\
$nodejs\
$rust\
$golang\
$python\
[](bg:#3b4252 fg:#434c5e)\
$time\
[ ](fg:#3b4252)\
$character"""

add_newline = true

[username]
show_always = false
style_user = "bg:#2e3440 fg:#ffffff"
style_root = "bg:#2e3440 fg:#f38ba8"
format = '[$user ]($style)'

[os]
style = "bg:#4c566a fg:#ffffff"
disabled = false

[os.symbols]
Arch = "󰣇 "
CachyOS = "󰣇 "
Linux = "󰌽 "

[directory]
style = "bg:#4c566a fg:#ffffff"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#3b4252 fg:#89b4fa"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#3b4252 fg:#f38ba8"
format = '[$all_status$ahead_behind ]($style)'

[time]
disabled = false
time_format = "%I:%M %p"
style = "bg:#3b4252 fg:#cdd6f4"
format = "[ $time ]($style)"

[cmd_duration]
disabled = false
min_time = 2000
style = 'bg:#4c566a fg:#f9e2af'
format = '[ took $duration ]($style)'

[nodejs]
symbol = " "
style = "bg:#434c5e fg:#a6e3a1"
format = '[ $symbol($version )]($style)'

[rust]
symbol = " "
style = "bg:#434c5e fg:#f38ba8"
format = '[ $symbol($version )]($style)'

[golang]
symbol = " "
style = "bg:#434c5e fg:#89dceb"
format = '[ $symbol($version )]($style)'

[python]
symbol = " "
style = "bg:#434c5e fg:#f9e2af"
format = '[ $symbol($version )]($style)'

[character]
success_symbol = "[❯](bold #38bdf8)"
error_symbol = "[❯](bold #f38ba8)"
vicmd_symbol = "[❮](bold #a6e3a1)"
