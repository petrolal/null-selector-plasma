# ==============================================================================
# Starship Prompt Configuration (Sanguine Node Style)
# Rice: sanguine-node-rice
# ==============================================================================

format = """
[ ](#141416)\
$os\
[](fg:#141416 bg:#221518)\
$directory\
[](fg:#221518 bg:#3b1e24)\
$git_branch\
$git_status\
[](fg:#3b1e24 bg:#1c181a)\
$cmd_duration\
$nodejs\
$rust\
$golang\
$python\
[](fg:#1c181a bg:#100e10)\
$time\
[ ](fg:#100e10)\
$character"""

add_newline = true

[username]
show_always = false
style_user = "bg:#141416 fg:#ffffff"
style_root = "bg:#141416 fg:#ff2233"
format = '[$user ]($style)'

[os]
style = "bg:#141416 fg:#f0e6e6"
disabled = false

[os.symbols]
Arch = "󰣇 "
CachyOS = "󰣇 "
Linux = "󰌽 "

[directory]
style = "bg:#221518 fg:#f5f0f0 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#3b1e24 fg:#ffffff"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#3b1e24 fg:#ff3344"
format = '[$all_status$ahead_behind ]($style)'

[time]
disabled = false
time_format = "%I:%M %p"
style = "bg:#18181c fg:#a0a0a0"
format = "[ $time ]($style)"

[cmd_duration]
disabled = false
min_time = 2000
style = 'bg:#242429 fg:#e0e0e0'
format = '[ took $duration ]($style)'

[nodejs]
symbol = " "
style = "bg:#242429 fg:#e0e0e0"
format = '[ $symbol($version )]($style)'

[rust]
symbol = " "
style = "bg:#242429 fg:#e0e0e0"
format = '[ $symbol($version )]($style)'

[golang]
symbol = " "
style = "bg:#242429 fg:#e0e0e0"
format = '[ $symbol($version )]($style)'

[python]
symbol = " "
style = "bg:#242429 fg:#e0e0e0"
format = '[ $symbol($version )]($style)'

[character]
success_symbol = "[❯](bold #e60026)"
error_symbol = "[❯](bold #ff1122)"
vicmd_symbol = "[❮](bold #772233)"

