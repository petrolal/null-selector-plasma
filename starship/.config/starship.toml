# ==============================================================================
# Starship Prompt Configuration (Monochrome Cyberpunk Style)
# Rice: null-sector-plasma
# ==============================================================================

format = """
[ ](#1c1c1f)\
$os\
[](fg:#1c1c1f bg:#2b2b30)\
$directory\
[](fg:#2b2b30 bg:#3d3d45)\
$git_branch\
$git_status\
[](fg:#3d3d45 bg:#242429)\
$cmd_duration\
$nodejs\
$rust\
$golang\
$python\
[](fg:#242429 bg:#18181c)\
$time\
[ ](fg:#18181c)\
$character"""

add_newline = true

[username]
show_always = false
style_user = "bg:#1c1c1f fg:#ffffff"
style_root = "bg:#1c1c1f fg:#ff4444"
format = '[$user ]($style)'

[os]
style = "bg:#1c1c1f fg:#ffffff"
disabled = false

[os.symbols]
Arch = "󰣇 "
CachyOS = "󰣇 "
Linux = "󰌽 "

[directory]
style = "bg:#2b2b30 fg:#ffffff bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#3d3d45 fg:#ffffff"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#3d3d45 fg:#ff4444"
format = '[$all_status$ahead_behind ]($style)'

[time]
disabled = false
time_format = "%I:%M %p"
style = "bg:#18181c fg:#a0a0a0"
format = "[ $time ]($style)"

[cmd_duration]
disabled = false
min_time = 2000
style = 'bg:#242429 fg:#e0e0e0'
format = '[ took $duration ]($style)'

[nodejs]
symbol = " "
style = "bg:#242429 fg:#e0e0e0"
format = '[ $symbol($version )]($style)'

[rust]
symbol = " "
style = "bg:#242429 fg:#e0e0e0"
format = '[ $symbol($version )]($style)'

[golang]
symbol = " "
style = "bg:#242429 fg:#e0e0e0"
format = '[ $symbol($version )]($style)'

[python]
symbol = " "
style = "bg:#242429 fg:#e0e0e0"
format = '[ $symbol($version )]($style)'

[character]
success_symbol = "[❯](bold #ffffff)"
error_symbol = "[❯](bold #ff4444)"
vicmd_symbol = "[❮](bold #888888)"

