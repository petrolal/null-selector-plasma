# ==============================================================================
# Kitty Terminal Configuration: Plasma Monochrome Rice (Cyberpunk / NieR)
# ==============================================================================

# --- Typography & Fonts ---
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# --- Window Layout & Padding ---
window_padding_width  14 16
placement_strategy    center
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size   no
initial_window_width   920
initial_window_height  560
resize_draw_strategy   static

# --- Background & Opacity (KWin Force Blur Integration) ---
background_opacity     0.85
background_blur        1
dynamic_background_opacity yes

# --- Cursor Customization ---
cursor                 #ffffff
cursor_text_color      #000000
cursor_shape           block
cursor_beam_thickness  1.5
cursor_underline_thickness 2.0
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0

# --- Monochrome Color Palette ---
foreground             #dedede
background             #0e0e10
selection_foreground   #ffffff
selection_background   #38383c

# Black
color0                 #1e1e20
color8                 #4a4a4e

# Red
color1                 #8a8a8c
color9                 #a4a4a8

# Green
color2                 #a0a0a4
color10                #b8b8bc

# Yellow
color3                 #b2b2b6
color11                #c8c8cc

# Blue
color4                 #c0c0c4
color12                #d8d8dc

# Magenta
color5                 #8e8e92
color13                #adadb2

# Cyan
color6                 #9c9ca0
color14                #c2c2c6

# White
color7                 #dcdcdf
color15                #ffffff

# URL & Underline
url_color              #ffffff
url_style              straight
open_url_with          default
detect_urls            yes

# --- Tab Bar Styling ---
tab_bar_edge           top
tab_bar_style          powerline
tab_powerline_style    slanted
active_tab_foreground   #0e0e10
active_tab_background   #dedede
active_tab_font_style   bold
inactive_tab_foreground #8a8a8c
inactive_tab_background #1e1e20
inactive_tab_font_style normal
tab_bar_background     #0e0e10

# --- Bell ---
enable_audio_bell      no
visual_bell_duration   0.0
window_alert_on_bell   yes

# --- Keybindings ---
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
map ctrl+shift+s        paste_from_selection

# Window / Split Management
map ctrl+shift+enter    new_window
map ctrl+shift+n        new_os_window
map ctrl+shift+w        close_window
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window

# Tab Management
map ctrl+shift+t        new_tab
map ctrl+shift+q        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab

# Layout Switching
map ctrl+shift+l        next_layout

# Font Size Control
map ctrl+shift+equal    change_font_size all +1.0
map ctrl+shift+plus     change_font_size all +1.0
map ctrl+shift+kp_add   change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+kp_subtract change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Scrolling
map ctrl+shift+up        scroll_line_up
map ctrl+shift+k         scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+j         scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end
